[package]
name = "fract"
version = "0.2.4"
edition = "2021"
authors = ["Fract Contributors"]
description = "Autonomous architectural maintenance daemon for Rust projects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fract-dev/fract"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
notify = "8.0"
axum = "0.8"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = "0.21"

[dev-dependencies]

[[bench]]
name = "walkdir_scanner_bench"
harness = false

[[bench]]
name = "anyhow_bench"
harness = false

[[bench]]
name = "chrono_bench"
harness = false

[[bench]]
name = "serde_json_bench"
harness = false

[[bench]]
name = "clap_bench"
harness = false

[[bench]]
name = "uuid-tempfile-async-trait-tower-http_bench"
harness = false

[[bench]]
name = "perf_suite"
harness = false
