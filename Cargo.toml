[package]
name = "fract"
version = "0.4.2"
edition = "2021"
authors = ["Fract Contributors"]
description = "Autonomous architectural maintenance daemon for Rust, Python, TypeScript, and JavaScript projects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elci-group/fract"
homepage = "https://github.com/elci-group/fract"
documentation = "https://github.com/elci-group/fract#readme"
keywords = ["refactoring", "static-analysis", "entropy", "daemon", "code-quality"]
categories = ["development-tools"]
rust-version = "1.96"

[lints.clippy]
# Pedantic lints are enforced project-wide; the allows below are the
# deliberate exceptions, each justified inline.
pedantic = { level = "warn", priority = -1 }
# Entropy/health math is inherently f64 over integer metrics; precision loss
# at 2^53 is irrelevant for 0.0-1.0 scores and line counts.
cast_precision_loss = "allow"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
notify = "8.0"
axum = "0.8"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = "0.21"

[dev-dependencies]

[[bench]]
name = "walkdir_scanner_bench"
harness = false

[[bench]]
name = "anyhow_bench"
harness = false

[[bench]]
name = "chrono_bench"
harness = false

[[bench]]
name = "serde_json_bench"
harness = false

[[bench]]
name = "clap_bench"
harness = false

[[bench]]
name = "uuid-tempfile-async-trait-tower-http_bench"
harness = false

[[bench]]
name = "perf_suite"
harness = false
