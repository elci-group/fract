name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Quality gate (fmt, clippy, test, release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (pedantic, -D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: release build
        run: cargo build --release
      # NOTE: the amber dependency-policy step from scripts/ci.sh is local-only
      # (amber is a private tool); the GitHub gate covers everything else.

  security:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: measure
        run: cargo tarpaulin --lib --tests --out stdout --timeout 300 --skip-clean --fail-under 80
